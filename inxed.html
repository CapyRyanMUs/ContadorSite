<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="counter-card">
            <h1>Contador</h1>
            <p class="label">Valor atual</p>
            <div class="counter-display">
                <span id="counter-value">0</span>
            </div>
            <div class="buttons">
                <button id="decrement-btn" class="btn btn-danger" type="button">−</button>
                <button id="reset-btn" class="btn btn-secondary" type="button">Resetar</button>
                <button id="increment-btn" class="btn btn-success" type="button">+</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
